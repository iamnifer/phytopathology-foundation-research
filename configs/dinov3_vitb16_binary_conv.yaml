experiment:
  name: dinov3_vitb16_binary_conv
  output_dir: runs
  seed: 42

data:
  root: data/plantseg_v3
  metadata_file: Metadatav2.csv
  image_size: 384
  num_classes: 2
  ignore_index: 255
  batch_size: 16
  num_workers: 8
  binary_masks: true

model:
  backbone: models/dinov3-vitb16-pretrain-lvd1689m
  decoder: conv
  freeze_backbone: true

training:
  epochs: 10
  learning_rate: 0.001
  weight_decay: 0.0001
  amp: true
  exclude_background_from_miou: false
  selection_metric: foreground_iou
