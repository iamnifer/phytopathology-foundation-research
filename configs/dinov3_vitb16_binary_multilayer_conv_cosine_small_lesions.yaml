experiment:
  name: dinov3_vitb16_binary_multilayer_conv_cosine_small_lesions
  output_dir: runs
  seed: 42

data:
  root: data/plantseg_v3
  metadata_file: Metadatav2.csv
  image_size: 384
  num_classes: 2
  ignore_index: 255
  batch_size: 16
  num_workers: 8
  binary_masks: true
  resize_mode: stretch
  augmentation: horizontal_flip
  sampling: small_lesion_oversample
  small_lesion_quantile: 0.25
  small_lesion_factor: 2.0

model:
  backbone: models/dinov3-vitb16-pretrain-lvd1689m
  decoder: conv
  freeze_backbone: true
  feature_layers: four_even

training:
  epochs: 30
  learning_rate: 0.001
  minimum_learning_rate: 0.00001
  scheduler: cosine
  weight_decay: 0.0001
  amp: true
  exclude_background_from_miou: false
  selection_metric: foreground_iou
