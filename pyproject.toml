[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "phytopathology-foundation-research"
version = "0.1.0"
description = "Reproducible CNN and transformer transfer experiments for PlantSeg"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Alexander Reznichenko" },
]
keywords = [
  "computer-vision",
  "dinov3",
  "plant-disease",
  "semantic-segmentation",
  "transfer-learning",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "Pillow>=10.0",
  "matplotlib>=3.8",
  "PyYAML>=6.0",
  "torch>=2.3",
  "torchvision>=0.18",
  "tqdm>=4.66",
  "transformers>=4.56,<6",
]

[project.optional-dependencies]
download = ["modelscope>=1.34"]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/iamnifer/phytopathology-foundation-research"
Repository = "https://github.com/iamnifer/phytopathology-foundation-research"
Report = "https://github.com/iamnifer/phytopathology-foundation-research/blob/main/report/coursework.pdf"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
