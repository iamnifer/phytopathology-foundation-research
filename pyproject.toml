[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "phytopathology-foundation-research"
version = "0.1.0"
description = "Reproducible DINOv3 experiments for PlantSeg"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "Pillow>=10.0",
  "matplotlib>=3.8",
  "PyYAML>=6.0",
  "torch>=2.3",
  "torchvision>=0.18",
  "tqdm>=4.66",
  "transformers>=4.56,<6",
]

[project.optional-dependencies]
download = ["modelscope>=1.34"]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
